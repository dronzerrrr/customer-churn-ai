line-length = 100
target-version = "py311"
extend-exclude = [".venv", "notebooks"]

[lint]
select = ["E", "F", "W", "B"]
ignore = [
    "B008",   # FastAPI uses Depends()/Query() in argument defaults by design
    "E501",   # long lines are tolerated; formatting is not enforced
]

[lint.per-file-ignores]
"api/main.py" = ["BLE001"]
"app/streamlit_app.py" = ["E402"]   # sys.path must be set before the app imports